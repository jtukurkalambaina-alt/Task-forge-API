openapi: 3.0.3

info:
  title: TaskForge API
  version: 1.0.0
  description: Local MVP API and browser app for managing TaskForge items.
  contact:
    email: api-support@taskforge.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:8000/v1
    description: Local development server
  - url: https://api.taskforge.com/v1
    description: Production server placeholder

tags:
  - name: auth
    description: Authentication endpoints
  - name: items
    description: Item management endpoints

paths:
  /health:
    get:
      tags: [auth]
      summary: Health check
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Service is healthy
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: TaskForge API

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in and receive a bearer token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: demo@taskforge.local
              password: demo123
      responses:
        '200':
          description: Login succeeded
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /me:
    get:
      tags: [auth]
      summary: Get the signed-in user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /items:
    get:
      tags: [items]
      summary: List items
      operationId: listItems
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          description: Search by item name or description
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, draft]
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, updatedAt, name, price]
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200': { $ref: '#/components/responses/ItemListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    post:
      tags: [items]
      summary: Create an item
      operationId: createItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
            example:
              name: New Laptop
              description: Top-spec developer laptop
              price: 2500.5
              currency: USD
              status: active
              tags: [hardware, electronics]
      responses:
        '201': { $ref: '#/components/responses/ItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^item_[a-zA-Z0-9]+$'
    get:
      tags: [items]
      summary: Get item by ID
      operationId: getItemById
      security:
        - bearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    put:
      tags: [items]
      summary: Replace item by ID
      operationId: updateItemById
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    patch:
      tags: [items]
      summary: Partially update item by ID
      operationId: patchItemById
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPatchInput'
            example:
              status: archived
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    delete:
      tags: [items]
      summary: Delete item by ID
      operationId: deleteItemById
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Item deleted successfully
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token

  headers:
    X-Request-ID:
      description: Unique identifier for the request.
      schema:
        type: string
        example: req_7f3a2b1c4d5e6f

  schemas:
    User:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: demo@taskforge.local
        name:
          type: string
          example: Demo User

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [token, tokenType, user]
      properties:
        token:
          type: string
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'

    Item:
      type: object
      required: [id, name, status, tags, createdAt, updatedAt]
      properties:
        id:
          type: string
          readOnly: true
          pattern: '^item_[a-zA-Z0-9]+$'
          example: item_123
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: New Laptop
        description:
          type: string
          nullable: true
          maxLength: 2000
          example: Top-spec developer laptop
        price:
          type: number
          format: double
          minimum: 0
          nullable: true
          example: 2500.5
        currency:
          type: string
          nullable: true
          pattern: '^[A-Z]{3}$'
          example: USD
        status:
          type: string
          enum: [active, archived, draft]
          default: draft
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 50
            pattern: '^[a-zA-Z0-9_-]+$'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    ItemInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        price:
          type: number
          minimum: 0
          nullable: true
        currency:
          type: string
          nullable: true
          pattern: '^[A-Z]{3}$'
        status:
          type: string
          enum: [active, archived, draft]
          default: draft
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 50
            pattern: '^[a-zA-Z0-9_-]+$'

    ItemPatchInput:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        price:
          type: number
          minimum: 0
          nullable: true
        currency:
          type: string
          nullable: true
          pattern: '^[A-Z]{3}$'
        status:
          type: string
          enum: [active, archived, draft]
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 50
            pattern: '^[a-zA-Z0-9_-]+$'

    Error:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string
        details:
          type: object
          nullable: true
          additionalProperties: true

    PaginationMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    PaginatedItems:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

  responses:
    ItemResponse:
      description: Successful item response
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Item'

    ItemListResponse:
      description: Paginated list of items
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedItems'

    BadRequest:
      description: Invalid request
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Authentication required or invalid credentials
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Server encountered an unexpected condition
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
